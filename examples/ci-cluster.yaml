# KIND cluster configuration for CI/CD environments
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker

# Networking configuration
networking:
  # Optional: Customize pod and service subnets
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  
# Feature gates for testing new features
featureGates:
  EphemeralContainers: true
